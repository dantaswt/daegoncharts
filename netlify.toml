[build]
  command = "npx vite build && node -e \"const f=require('./.netlify/functions/manifest.json');f.functions.forEach(fn=>fn.runtimeVersion='nodejs20.x');require('fs').writeFileSync('./.netlify/functions/manifest.json',JSON.stringify(f))\""
  publish = "dist"
  functions = ".netlify/functions-internal"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server/server"
  status = 200
