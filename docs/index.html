<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daegon Charts">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>Daegon Charts App</title>
  <style>
    :root{
      --bg:#09090b;--bg2:#111114;--panel:#151518;--panel-soft:#1c1c20;--panel-strong:#202024;
      --text:#f7f7f8;--muted:#9999a2;--muted2:#6f6f78;--line:#2b2b31;
      --gold:#d4af37;--gold2:#f0d77a;--green:#57d68d;--red:#ff7474;--blue:#74a9ff;
      --shadow:0 10px 28px rgba(0,0,0,.24);
    }
    *{box-sizing:border-box}
    html{background:var(--bg);color-scheme:dark;scroll-behavior:smooth}
    body{
      margin:0;min-height:100vh;color:var(--text);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 50% -150px,rgba(212,175,55,.15),transparent 360px),
        linear-gradient(180deg,#0d0d10 0,#09090b 420px);
      -webkit-font-smoothing:antialiased;
    }
    button,select,input{font:inherit}
    button{touch-action:manipulation}
    .shell{max-width:920px;margin:0 auto;padding:env(safe-area-inset-top) 14px calc(36px + env(safe-area-inset-bottom))}
    header{
      position:sticky;top:0;z-index:30;margin:0 -14px;
      padding:10px 14px 12px;
      background:linear-gradient(180deg,rgba(9,9,11,.97),rgba(9,9,11,.91));
      backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:48px}
    .eyebrow{font-size:10px;font-weight:800;letter-spacing:.17em;color:var(--muted2);text-transform:uppercase}
    .brand{
      text-align:center;font-size:20px;font-weight:950;letter-spacing:-.7px;
      white-space:nowrap;
    }
    .brand span{color:var(--gold2)}
    .status{
      justify-self:end;display:flex;align-items:center;gap:6px;
      font-size:10px;font-weight:800;color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.08em
    }
    .status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(87,214,141,.10)}
    .tabs{
      display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
      margin-top:7px;padding:4px;border-radius:14px;background:#111114;border:1px solid rgba(255,255,255,.05)
    }
    .tab{
      min-height:40px;border:0;background:transparent;color:#8e8e98;padding:8px 6px;border-radius:10px;
      font-size:11px;font-weight:900;letter-spacing:.035em;cursor:pointer;transition:.18s ease
    }
    .tab.active{
      color:#111;background:linear-gradient(180deg,#f0d77a,#d4af37);
      box-shadow:0 5px 14px rgba(212,175,55,.22)
    }
    .hero{
      position:relative;overflow:hidden;margin:14px 0 10px;padding:18px 18px 17px;border-radius:22px;
      background:
        radial-gradient(circle at 88% 0,rgba(212,175,55,.18),transparent 220px),
        linear-gradient(145deg,#18181c,#111114);
      border:1px solid rgba(255,255,255,.07);box-shadow:var(--shadow)
    }
    .hero::after{
      content:"";position:absolute;width:150px;height:150px;border:1px solid rgba(212,175,55,.12);
      border-radius:50%;right:-62px;top:-72px;
    }
    .hero-kicker{font-size:10px;font-weight:900;letter-spacing:.16em;color:var(--gold2);text-transform:uppercase;margin-bottom:5px}
    h1{font-size:30px;line-height:1.02;margin:0;font-weight:950;letter-spacing:-1.05px}
    .dateLabel{margin-top:7px;font-size:12px;color:var(--muted)}
    .count{margin-top:12px;font-size:10px;font-weight:850;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em}
    .controls{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:4px 0 12px}
    .row{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:8px}
    .field{position:relative}
    .field::before{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.55;pointer-events:none}
    .field.date::before{content:"◷"}
    .field.search::before{content:"⌕";font-size:18px}
    select,input,.iconbtn{
      width:100%;min-height:47px;border:1px solid var(--line);border-radius:13px;background:rgba(21,21,24,.92);
      color:var(--text);outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)
    }
    select{padding:0 36px 0 36px;appearance:none}
    input{padding:0 14px 0 38px}
    input::placeholder{color:#676771}
    select:focus,input:focus,.iconbtn:focus{border-color:rgba(212,175,55,.72);box-shadow:0 0 0 3px rgba(212,175,55,.09)}
    .iconbtn{display:grid;place-items:center;padding:0;font-size:19px;cursor:pointer;background:var(--panel)}
    .section-label{
      display:flex;align-items:center;justify-content:space-between;padding:4px 3px 10px;
      color:var(--muted2);font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase
    }
    #list{display:flex;flex-direction:column;gap:9px}
    .card{
      position:relative;display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;
      min-height:92px;padding:12px 12px 12px 9px;border-radius:16px;
      background:linear-gradient(180deg,rgba(24,24,28,.98),rgba(19,19,22,.98));
      border:1px solid rgba(255,255,255,.065);
      box-shadow:0 4px 16px rgba(0,0,0,.14);
      overflow:hidden;
    }
    .card.top1{border-color:rgba(212,175,55,.42);background:linear-gradient(145deg,rgba(54,45,17,.72),rgba(21,21,24,.98) 48%)}
    .card.top2{border-color:rgba(190,197,204,.25)}
    .card.top3{border-color:rgba(171,116,67,.27)}
    .card.top1::before{
      content:"";position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(#f0d77a,#b98e14)
    }
    .rank{
      display:flex;align-items:center;justify-content:center;align-self:stretch;
      font-size:29px;font-weight:950;letter-spacing:-1.5px;color:#fafafa;
      border-right:1px solid rgba(255,255,255,.07);padding-right:9px
    }
    .top1 .rank{color:var(--gold2);text-shadow:0 2px 14px rgba(212,175,55,.18)}
    .top2 .rank{color:#d9dde2}
    .top3 .rank{color:#c58f68}
    .main{min-width:0;display:flex;flex-direction:column;justify-content:center}
    .line1{display:flex;gap:9px;align-items:flex-start;justify-content:space-between}
    .name{
      font-size:15.5px;font-weight:900;letter-spacing:-.22px;line-height:1.2;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis
    }
    .artist{
      font-size:12.5px;font-weight:600;color:#a5a5ae;margin-top:4px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis
    }
    .diff{
      min-width:32px;text-align:center;font-size:10px;font-weight:950;letter-spacing:.02em;flex:0 0 auto;
      padding:5px 7px;border-radius:999px;background:#202025;color:#8f8f98;border:1px solid rgba(255,255,255,.04)
    }
    .diff.up{color:var(--green);background:rgba(87,214,141,.08)}
    .diff.down{color:var(--red);background:rgba(255,116,116,.08)}
    .diff.new{color:var(--gold2);background:rgba(212,175,55,.10)}
    .diff.re{color:var(--blue);background:rgba(116,169,255,.09)}
    .stats{
      display:grid;grid-template-columns:repeat(4,max-content);gap:13px;margin-top:10px;
      font-size:9px;color:#6f6f78;text-transform:uppercase;letter-spacing:.08em
    }
    .stats span{display:flex;gap:4px;align-items:baseline}
    .stats b{color:#bfc0c5;font-size:10px;font-weight:900;letter-spacing:0}
    .empty,.loading,.error{
      padding:46px 18px;text-align:center;color:var(--muted);background:var(--panel);
      border:1px solid var(--line);border-radius:18px
    }
    .loading::before{content:"";display:block;width:24px;height:24px;margin:0 auto 12px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error{color:#ff9f9f}
    .footer{padding:26px 8px 2px;text-align:center;color:#62626b;font-size:10px;line-height:1.55}
    .install{
      display:none;margin-top:12px;width:100%;min-height:47px;border:1px solid rgba(212,175,55,.55);
      background:rgba(212,175,55,.07);color:var(--gold2);font-weight:900;border-radius:13px;cursor:pointer
    }
    @media(min-width:680px){
      .shell{padding-left:20px;padding-right:20px}
      header{margin-left:-20px;margin-right:-20px;padding-left:22px;padding-right:22px}
      .hero{padding:24px 24px 22px}
      h1{font-size:38px}
      .controls{grid-template-columns:1fr 1fr}
      .card{grid-template-columns:72px minmax(0,1fr);padding:15px 16px 15px 10px}
      .rank{font-size:34px}
      .name{font-size:17px}
      .artist{font-size:13.5px}
    }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="top">
      <div class="eyebrow">WEEKLY MUSIC</div>
      <div class="brand">daegon <span>charts</span></div>
      <div class="status" id="status">carregando…</div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-chart="songs">HOT 100</button>
      <button class="tab" data-chart="albums">ALBUMS</button>
      <button class="tab" data-chart="artists">ARTISTS</button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-kicker">DAEGON CHARTS</div>
    <h1 id="title">Hot 100 Songs</h1>
    <div class="dateLabel" id="dateLabel"></div>
    <div class="count" id="count"></div>
  </section>

  <section class="controls">
    <div class="row">
      <div class="field date"><select id="dateSelect" aria-label="Semana"></select></div>
      <button id="refresh" class="iconbtn" aria-label="Atualizar">↻</button>
    </div>
    <div class="field search"><input id="search" type="search" placeholder="Buscar no chart…" autocomplete="off"></div>
  </section>

  <div class="section-label"><span>Ranking semanal</span><span>Peak · Weeks · LW</span></div>
  <main id="list"><div class="loading">Carregando os charts…</div></main>
  <button id="install" class="install">Adicionar Daegon Charts à tela inicial</button>
  <div class="footer">Versão app independente do Vercel. Dados lidos das mesmas planilhas públicas usadas pelo Daegon Charts.</div>
</div>
<script>
(() => {
  const BASE='https://docs.google.com/spreadsheets/d/1t6_7SOlspmNYrXq8PSfJ74frIdrWwQBFITQ3bQmRzeg/gviz/tq?tq=select%20*&tqx=out:csv&gid=';
  const BASE2='https://docs.google.com/spreadsheets/d/1BUo5KNCtoWAMpezDYwv80MY9njOUyuJJRPQbmPbCZH4/gviz/tq?tq=select%20*&tqx=out:csv&gid=';
  const BASE2SONGS='https://docs.google.com/spreadsheets/d/1BUo5KNCtoWAMpezDYwv80MY9njOUyuJJRPQbmPbCZH4/gviz/tq?tq=select%20A,B,C,D,E,F,G,H,I,J&tqx=out:csv&gid=';
  const CONFIG={
    songs:{title:'Hot 100 Songs',kind:'song',primary:BASE+'904867620',secondary:BASE2SONGS+'1011796371'},
    albums:{title:'Top Albums',kind:'album',primary:BASE+'1940039611',secondary:BASE2+'765580865'},
    artists:{title:'Top Artists',kind:'artist',primary:BASE+'1568177610',secondary:BASE2+'1959135946'}
  };
  const state={chart:'songs',data:{},dates:[],query:''};
  const el=id=>document.getElementById(id);
  const list=el('list'), dateSelect=el('dateSelect'), title=el('title'), dateLabel=el('dateLabel'), count=el('count'), status=el('status');

  function csv(text){
    const rows=[]; let row=[], field='', q=false;
    for(let i=0;i<text.length;i++){
      const c=text[i], n=text[i+1];
      if(q){
        if(c==='"'&&n==='"'){field+='"';i++;}
        else if(c==='"'){q=false;}
        else field+=c;
      }else{
        if(c==='"')q=true;
        else if(c===','){row.push(field);field='';}
        else if(c==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field='';}
        else field+=c;
      }
    }
    if(field.length||row.length){row.push(field.replace(/\r$/,''));rows.push(row);}
    return rows.filter(r=>r.some(v=>v!==''));
  }
  const norm=s=>(s||'').trim().toLowerCase();
  function idx(h,keys){for(const k of keys){const i=h.indexOf(k);if(i>=0)return i}return -1}
  function date(v){
    v=(v||'').trim();
    if(v.includes('/')){const p=v.split('/');if(p.length===3)return p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0')}
    return v;
  }
  function num(v){const n=parseInt(String(v||'').replace(/[^0-9-]/g,''),10);return Number.isFinite(n)?n:0}
  function parseRows(rows,cfg){
    if(!rows.length)return {};
    const h=rows[0].map(norm);
    const I={
      date:idx(h,['date','chart date']),pos:idx(h,['position','rank','pos']),diff:idx(h,['dif','diff','▲▼']),
      song:idx(h,['song','title','track']),album:idx(h,['album']),artist:idx(h,['artist','artists']),
      lw:idx(h,['last week','lw','last wk','prev week','previous week']),peak:idx(h,['peak']),weeks:idx(h,['weeks','wks']),
      w1:idx(h,['weeks at 1','wks at 1','week at #1','week at 1','weeks at #1'])
    };
    const ni=cfg.kind==='artist'?I.artist:cfg.kind==='album'?I.album:I.song;
    const out={};
    for(const r of rows.slice(1)){
      const d=date(r[I.date]), name=(r[ni]||'').trim(), artist=(r[I.artist]||'').trim(), position=num(r[I.pos]);
      if(!d||!name||!position)continue;
      (out[d]||(out[d]=[])).push({position,name,artist,diff:I.diff>=0?(r[I.diff]||'').trim():'',lastWeek:I.lw>=0?(r[I.lw]||'').trim():'',peak:num(r[I.peak]),weeks:num(r[I.weeks]),weeksAt1:I.w1>=0?num(r[I.w1]):0});
    }
    return out;
  }
  function merge(a,b){
    const out={...a};
    for(const [d,arr] of Object.entries(b)){
      const m=new Map((out[d]||[]).map(x=>[(x.name+'|'+x.artist).toLowerCase(),x]));
      for(const e of arr){const k=(e.name+'|'+e.artist).toLowerCase();const old=m.get(k);if(!old||e.position<old.position)m.set(k,e)}
      out[d]=[...m.values()].sort((x,y)=>x.position-y.position);
    }
    return out;
  }
  function diffClass(v){v=(v||'').toUpperCase();if(v==='NEW')return'new';if(v==='RE')return're';if(v.includes('▲')||v.startsWith('+'))return'up';if(v.includes('▼')||v.startsWith('-'))return'down';return''}
  function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function prettyDate(v){if(!v)return'';const [y,m,d]=v.split('-');return d+'/'+m+'/'+y}
  function render(){
    title.textContent=CONFIG[state.chart].title;
    const d=dateSelect.value||state.dates[state.dates.length-1]||'';
    dateLabel.textContent=d?'Semana de '+prettyDate(d):'';
    const q=norm(el('search').value);
    const rows=(state.data[d]||[]).filter(e=>!q||norm(e.name).includes(q)||norm(e.artist).includes(q));
    count.textContent=rows.length+(rows.length===1?' item':' itens');
    if(!rows.length){list.innerHTML='<div class="empty">Nenhum item encontrado nesta semana.</div>';return}
    list.innerHTML=rows.map(e=>`
      <article class="card ${e.position===1?'top1':e.position===2?'top2':e.position===3?'top3':''}">
        <div class="rank">${e.position}</div>
        <div class="main">
          <div class="line1">
            <div style="min-width:0">
              <div class="name">${escapeHtml(e.name)}</div>
              <div class="artist">${escapeHtml(e.artist||'')}</div>
            </div>
            <div class="diff ${diffClass(e.diff)}">${escapeHtml(e.diff||'=')}</div>
          </div>
          <div class="stats">
            <span>LW <b>${escapeHtml(e.lastWeek||'—')}</b></span>
            <span>PEAK <b>${e.peak||e.position}</b></span>
            <span>WEEKS <b>${e.weeks||'—'}</b></span>
            ${e.weeksAt1?'<span>#1 <b>'+e.weeksAt1+'w</b></span>':''}
          </div>
        </div>
      </article>`).join('');
  }
  async function fetchText(url){
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    return res.text();
  }
  async function load(chart,force=false){
    state.chart=chart;status.textContent='carregando…';list.innerHTML='<div class="loading">Carregando '+CONFIG[chart].title+'…</div>';
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.chart===chart));
    try{
      const cfg=CONFIG[chart];
      const [p,s]=await Promise.all([fetchText(cfg.primary),fetchText(cfg.secondary)]);
      state.data=merge(parseRows(csv(p),cfg),parseRows(csv(s),cfg));
      state.dates=Object.keys(state.data).sort();
      const old=dateSelect.value;
      dateSelect.innerHTML=state.dates.slice().reverse().map(d=>'<option value="'+d+'">'+prettyDate(d)+'</option>').join('');
      if(old&&state.data[old])dateSelect.value=old;
      status.textContent='online';
      render();
    }catch(err){
      console.error(err);
      status.textContent='erro ao carregar';
      list.innerHTML='<div class="error">Não consegui ler as planilhas agora. Toque em ↻ para tentar novamente.</div>';
    }
  }
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>load(b.dataset.chart)));
  dateSelect.addEventListener('change',render);
  el('search').addEventListener('input',render);
  el('refresh').addEventListener('click',()=>load(state.chart,true));

  let deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;el('install').style.display='block'});
  el('install').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;el('install').style.display='none'});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  load('songs');
})();
</script>
</body>
</html>
